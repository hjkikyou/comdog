<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/base-layout}">
<head>
    <link rel="stylesheet" href="/css/sign-up-first.css">
    <title>comdog 회원가입</title>
</head>

<main layout:fragment="container" class="signup-container">
    <h1>comdog 회원가입</h1>

   <a th:href="@{/sign-up-form}" class="btn btn-email" style="text-decoration: none;">
    <div class="icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
    </div>
    이메일로 comdog 회원가입
	</a>

    <button class="btn btn-naver">
        <div class="icon">
            <svg viewBox="0 0 100 100" fill="currentColor">
                <path d="M68.5 10H86v80H68.5l-37-45v45H14v-80h17.5l37 45z"/>
            </svg>
        </div>
        NAVER 계정으로 시작하기
    </button>

    <button class="btn btn-kakao">
        <div class="icon">
            <svg viewBox="0 0 100 100" fill="currentColor">
                <path d="M50 10C22.4 10 0 28.6 0 51.5c0 14.8 9.3 27.7 23.3 35.1-.8 3-2.9 10.7-3.3 12.3-.5 1.8 1.2 1.6 2.4.8 1.6-1.1 11.2-7.7 15.6-10.8 3.9.8 8 1.2 12.1 1.2 27.6 0 50-18.6 50-41.5S77.6 10 50 10z"/>
            </svg>
        </div>
        카카오 계정으로 시작하기
    </button>
</main>
</html>

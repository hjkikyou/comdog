<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/base-layout}">
<head>
    <title>COMDOG - 비밀번호 변경</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/reset-password.css}">
</head>

<body>
    <main layout:fragment="container" class="signup-container">
        <div class="reset-box">
            <div class="logo-area">
                <h1>COMDOG</h1>
                <p>컴퓨터 구매 & 인수형 렌탈</p>
            </div>

            <h2 class="page-title">비밀번호 변경</h2>

            <form th:action="@{/reset-password}" method="post" class="reset-form">
                
                <div class="input-group">
                    <label for="newPassword">새 비밀번호</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" name="newPassword" placeholder="새 비밀번호 입력" class="input-field">
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('newPassword', this)"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">새 비밀번호 확인</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="새 비밀번호 확인" class="input-field">
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)"></i>
                    </div>
                </div>

                <div class="notice-box">
                    <p class="notice-title">※유의사항※</p>
                    <ul>
                        <li>8자~15자 길이로 만들어주세요.</li>
                        <li>영문 대/소문자, 숫자, 특수 문자 2가지를 조합해주세요.</li>
                        <li>3자 이상 연속/동일한 문자, 숫자는 사용할 수 없습니다.</li>
                    </ul>
                </div>

                <button type="submit" class="btn-submit">변경하기</button>
            </form>
        </div>

        <script>
            function togglePasswordVisibility(inputId, icon) {
                const passwordInput = document.getElementById(inputId);
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash'); // 눈에 선 그어진 아이콘으로 변경
                } else {
                    passwordInput.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye'); // 원래 눈 아이콘으로 변경
                }
            }
        </script>
    </main>
</body>
</html>
